<script>
  const FILES = {
    perso: 'perso.png',
    gutachten: 'gutachten.png',
    waffenschein: 'waffenschein.png'
  };

  const ticket = `💎 Diamond Casino & Resort – Premium Bewerbung

Name / Ingame-Name: Jeff Adil Cüneyt Rince
Alter (IC): 36 Jahre
Alter (OOC): 19 Jahre
Handynummer: 6029103965
Position: Security

Warum möchte ich im Diamond Casino arbeiten?
- Ich möchte Teil eines exklusiven und professionellen Hauses sein
- Gäste und Mitarbeitende sollen sich jederzeit sicher fühlen
- Ich handle ruhig, diskret und professionell
- Ich möchte die luxuriöse Atmosphäre des Casinos aktiv schützen

Stärken:
- Stressresistent und belastbar
- Deeskalierendes, kontrolliertes Handeln
- Teamfähig und kommunikativ
- Prävention statt Eskalation
- Loyalität, Diskretion und Verantwortungsbewusstsein

Verfügbarkeit:
- Flexibel nach Absprache
- Besonders bei Events, Peak-Zeiten und hohem Gästeaufkommen verfügbar

Dokumente:
- Personalausweis
- Psychologisches Gutachten
- Waffenschein

Mit freundlichen Grüßen
Jeff Adil Cüneyt Rince`;

  document.getElementById('ticketText').textContent = ticket;

  document.body.classList.add('gold-black-mode');

  const rand = (min, max) => Math.random() * (max - min) + min;

  // custom cursor
  const cursorDot = document.getElementById('cursorDot');
  const cursorRing = document.getElementById('cursorRing');
  let cursorX = window.innerWidth / 2, cursorY = window.innerHeight / 2;
  let ringX = cursorX, ringY = cursorY;

  window.addEventListener('mousemove', (e) => {
    cursorX = e.clientX;
    cursorY = e.clientY;
    cursorDot.style.left = cursorX + 'px';
    cursorDot.style.top = cursorY + 'px';
  });

  function animateCursor(){
    ringX += (cursorX - ringX) * 0.18;
    ringY += (cursorY - ringY) * 0.18;
    cursorRing.style.left = ringX + 'px';
    cursorRing.style.top = ringY + 'px';
    requestAnimationFrame(animateCursor);
  }
  animateCursor();

  document.querySelectorAll('a, button, input, textarea, .playCard, .docBtn').forEach(el => {
    el.addEventListener('mouseenter', () => cursorRing.classList.add('hover'));
    el.addEventListener('mouseleave', () => cursorRing.classList.remove('hover'));
  });

  // floating casino chips
  const chipLayer = document.getElementById('chipFloatLayer');
  const chipColors = ['red','blue','green','gold'];

  for(let i = 0; i < 12; i++){
    const chip = document.createElement('div');
    chip.className = `chipFloat ${chipColors[i % chipColors.length]}`;
    chip.style.left = rand(0, 100) + 'vw';
    chip.style.top = rand(70, 120) + 'vh';
    chip.style.animationDuration = rand(10, 20) + 's';
    chip.style.animationDelay = rand(0, 12) + 's';
    chip.style.transform = `scale(${rand(.75, 1.25)})`;
    chipLayer.appendChild(chip);
  }

  // luxury theme toggle
  const luxuryModeBtn = document.getElementById('luxuryModeBtn');
  if(luxuryModeBtn){
    luxuryModeBtn.addEventListener('click', () => {
      document.body.classList.toggle('gold-black-mode');
      luxuryModeBtn.textContent = document.body.classList.contains('gold-black-mode')
        ? 'Gold Black'
        : 'Classic Neon';
    });
  }

  // sparkle generation
  const sparkHost = document.getElementById('sparkles');
  for(let i = 0; i < 34; i++){
    const s = document.createElement('div');
    s.className = 'spark';
    const size = rand(3, 8);
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = rand(0, 100) + 'vw';
    s.style.top = rand(65, 110) + 'vh';
    s.style.animationDuration = rand(7, 13) + 's';
    s.style.animationDelay = rand(0, 8) + 's';
    sparkHost.appendChild(s);
  }

  // coin rain
  const coinHost = document.getElementById('coins');
  for(let i = 0; i < 14; i++){
    const c = document.createElement('div');
    c.className = 'coin';
    c.style.left = rand(0, 100) + 'vw';
    c.style.animationDuration = rand(7, 13) + 's';
    c.style.animationDelay = rand(0, 12) + 's';
    c.style.opacity = rand(.45, .85);
    c.style.transform = `scale(${rand(.8,1.4)})`;
    coinHost.appendChild(c);
  }

  // loading + intro sequence
  const loadingScreen = document.getElementById('loadingScreen');
  const introScreen = document.getElementById('introScreen');
  const app = document.getElementById('app');
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');

  const loadingMessages = [
    'Initialisiere VIP-Lounge …',
    'Aktiviere Neon-System …',
    'Lade Diamond-Ambiente …',
    'Bereite High-Roller-Bereich vor …',
    'Starte Casino-Animationen …',
    'Bewerbungsprofil wird finalisiert …'
  ];

  let progress = 0;
  let messageIndex = 0;

  const loadInterval = setInterval(() => {
    progress += rand(7, 18);
    if(progress > 100) progress = 100;
    progressBar.style.width = progress + '%';
    progressText.textContent = `${loadingMessages[messageIndex % loadingMessages.length]} ${Math.floor(progress)}%`;
    messageIndex++;

    if(progress >= 100){
      clearInterval(loadInterval);
      setTimeout(() => {
        loadingScreen.classList.add('hide');
        introScreen.classList.add('show');
        setTimeout(() => {
          introScreen.classList.add('hide');
          app.classList.add('ready');
        }, 2300);
      }, 450);
    }
  }, 280);

  // hero parallax
  const hero = document.querySelector('.hero');
  const heroBg = document.getElementById('heroBg');

  hero.addEventListener('mousemove', (e) => {
    const rect = hero.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - .5;
    const y = (e.clientY - rect.top) / rect.height - .5;
    hero.style.transform = `rotateX(${(-y * 6).toFixed(2)}deg) rotateY(${(x * 8).toFixed(2)}deg)`;
    heroBg.style.transform = `scale(1.06) translate(${x * 18}px, ${y * 14}px)`;
  });

  hero.addEventListener('mouseleave', () => {
    hero.style.transform = 'rotateX(0deg) rotateY(0deg)';
    heroBg.style.transform = 'scale(1.05) translate(0,0)';
  });

  // tilt cards
  document.querySelectorAll('.tilt-card').forEach(card => {
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      card.style.transform = `rotateX(${(-y * 7).toFixed(2)}deg) rotateY(${(x * 9).toFixed(2)}deg) translateY(-4px)`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = '';
    });
  });

  // copy helper
  async function copyToClipboard(text){
    try{
      await navigator.clipboard.writeText(text);
      return true;
    }catch{
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }
  }

  // document modal
  const docModal = document.getElementById('docModal');
  const docImg = document.getElementById('docImg');
  const docTitle = document.getElementById('docTitle');
  const docHint = document.getElementById('docHint');
  const btnOpenNewTab = document.getElementById('btnOpenNewTab');
  const btnDownload = document.getElementById('btnDownload');
  let currentDoc = null;

  function openDoc(title, file){
    currentDoc = file;
    docTitle.textContent = title;
    docHint.textContent = `Datei: ${file}`;
    docImg.src = file;
    docImg.alt = title;
    btnDownload.href = file;
    btnDownload.setAttribute('download', file);

    if(typeof docModal.showModal === 'function') docModal.showModal();
    else window.open(file, '_blank', 'noopener,noreferrer');
  }

  document.getElementById('btnPerso').addEventListener('click', () => openDoc('Personalausweis', FILES.perso));
  document.getElementById('btnGutachten').addEventListener('click', () => openDoc('Psychologisches Gutachten', FILES.gutachten));
  document.getElementById('btnWaffe').addEventListener('click', () => openDoc('Waffenschein', FILES.waffenschein));

  document.getElementById('docClose').addEventListener('click', () => docModal.close());

  btnOpenNewTab.addEventListener('click', () => {
    if(currentDoc) window.open(currentDoc, '_blank', 'noopener,noreferrer');
  });

  docModal.addEventListener('click', (e) => {
    const rect = docModal.getBoundingClientRect();
    const inside = rect.top <= e.clientY && e.clientY <= rect.bottom && rect.left <= e.clientX && e.clientX <= rect.right;
    if(!inside) docModal.close();
  });

  // ticket modal
  const ticketModal = document.getElementById('ticketModal');
  const openTicketButtons = [document.getElementById('openTicketBtn'), document.getElementById('openTicketHero')];

  openTicketButtons.forEach(btn => btn.addEventListener('click', () => {
    if(typeof ticketModal.showModal === 'function') ticketModal.showModal();
    else alert(ticket);
  }));

  document.getElementById('ticketClose').addEventListener('click', () => ticketModal.close());

  document.getElementById('copyTicketBtn').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    const ok = await copyToClipboard(ticket);
    btn.textContent = ok ? '✅ Kopiert!' : '⚠️ Fehler';
    setTimeout(() => btn.textContent = 'Text kopieren', 1300);
  });

  ticketModal.addEventListener('click', (e) => {
    const rect = ticketModal.getBoundingClientRect();
    const inside = rect.top <= e.clientY && e.clientY <= rect.bottom && rect.left <= e.clientX && e.clientX <= rect.right;
    if(!inside) ticketModal.close();
  });

  // slot game
  const icons = ['♦', '7', '★', '♣', '♥', '💎'];
  const reel1 = document.getElementById('reel1');
  const reel2 = document.getElementById('reel2');
  const reel3 = document.getElementById('reel3');
  const spinBtn = document.getElementById('spinBtn');
  const autoSpinBtn = document.getElementById('autoSpinBtn');
  const jackpotText = document.getElementById('jackpotText');

  function randomIcon(){
    return icons[Math.floor(Math.random() * icons.length)];
  }

  function animateReel(el, duration = 900){
    return new Promise(resolve => {
      const start = performance.now();
      function frame(now){
        el.textContent = randomIcon();
        if(now - start < duration) requestAnimationFrame(frame);
        else resolve();
      }
      requestAnimationFrame(frame);
    });
  }

  async function spinSlots(){
    spinBtn.disabled = true;
    autoSpinBtn.disabled = true;
    jackpotText.textContent = 'Die Rollen drehen sich ...';

    await Promise.all([
      animateReel(reel1, 850),
      animateReel(reel2, 1200),
      animateReel(reel3, 1550)
    ]);

    const a = reel1.textContent;
    const b = reel2.textContent;
    const c = reel3.textContent;

    if(a === b && b === c) jackpotText.textContent = '🎉 JACKPOT! Perfekter Treffer – High Roller Luck.';
    else if(a === b || b === c || a === c) jackpotText.textContent = '✨ Stark! Zwei Symbole passen – fast ein Jackpot.';
    else jackpotText.textContent = '♠ Kein Treffer – versuche es erneut.';

    spinBtn.disabled = false;
    autoSpinBtn.disabled = false;
  }

  spinBtn.addEventListener('click', spinSlots);

  autoSpinBtn.addEventListener('click', async () => {
    spinBtn.disabled = true;
    autoSpinBtn.disabled = true;

    for(let i = 0; i < 3; i++){
      await spinSlots();
      await new Promise(r => setTimeout(r, 420));
    }

    spinBtn.disabled = false;
    autoSpinBtn.disabled = false;
  });

  // card flip game
  const cardsArea = document.getElementById('cardsArea');
  const dealCardsBtn = document.getElementById('dealCardsBtn');
  const cardResult = document.getElementById('cardResult');

  const deckChoices = [
    { rank:'A', suit:'♦', score:3 },
    { rank:'A', suit:'♠', score:3 },
    { rank:'K', suit:'♥', score:2 },
    { rank:'Q', suit:'♣', score:1 },
    { rank:'J', suit:'♦', score:1 },
    { rank:'7', suit:'★', score:2 }
  ];

  function createCard(cardData){
    const card = document.createElement('div');
    card.className = 'playCard';
    card.innerHTML = `
      <div class="cardFace cardFront"></div>
      <div class="cardFace cardBack ${cardData.score >= 3 ? 'win' : 'lose'}">
        <div class="rank">${cardData.rank}</div>
        <div class="suit">${cardData.suit}</div>
      </div>
    `;
    return card;
  }

  function shuffleArray(arr){
    return [...arr].sort(() => Math.random() - .5);
  }

  function setupCards(){
    cardsArea.innerHTML = '';
    cardResult.textContent = 'Decke die Karten auf und teste dein Glück.';
    const selected = shuffleArray(deckChoices).slice(0, 3);
    let flippedCount = 0;
    let totalScore = 0;

    selected.forEach(data => {
      const card = createCard(data);
      card.addEventListener('click', () => {
        if(card.classList.contains('flipped')) return;
        card.classList.add('flipped');
        flippedCount++;
        totalScore += data.score;

        if(flippedCount === 3){
          if(totalScore >= 8) cardResult.textContent = '💎 Premium Luck! High-Roller-Karten gezogen.';
          else if(totalScore >= 5) cardResult.textContent = '✨ Gute Runde! Starkes Blatt.';
          else cardResult.textContent = '♣ Solide Runde – probiere eine neue Ausgabe.';
        }
      }, { once:true });

      cardsArea.appendChild(card);
    });
  }

  dealCardsBtn.addEventListener('click', setupCards);
  setupCards();

  // roulette
  const rouletteWheel = document.getElementById('rouletteWheel');
  const rouletteBtn = document.getElementById('rouletteBtn');
  const rouletteResult = document.getElementById('rouletteResult');
  const rouletteValues = [
    'Schwarz 2', 'Rot 7', 'Schwarz 11', 'Grün 0', 'Schwarz 4',
    'Rot 13', 'Schwarz 8', 'Grün 00', 'Schwarz 1', 'Rot 9',
    'Schwarz 6', 'Grün VIP', 'Schwarz 10', 'Rot 15', 'Schwarz 3',
    'Grün 5', 'Schwarz 12', 'Rot 14', 'Schwarz 16', 'Grün 18'
  ];

  let rouletteRotation = 0;

  rouletteBtn.addEventListener('click', () => {
    const index = Math.floor(Math.random() * rouletteValues.length);
    const segmentAngle = 360 / rouletteValues.length;
    const targetCenter = index * segmentAngle + segmentAngle / 2;

    rouletteRotation += 1440 + (360 - targetCenter);
    rouletteWheel.style.transform = `rotate(${rouletteRotation}deg)`;
    rouletteResult.textContent = 'Das Rad dreht sich ...';
    rouletteBtn.disabled = true;

    setTimeout(() => {
      rouletteResult.textContent = `Ergebnis: ${rouletteValues[index]}`;
      rouletteBtn.disabled = false;
    }, 4300);
  });

  // =========================
  // ECHTE MUSIK-DATEI
  // =========================
  const music = document.getElementById('casinoMusic');
  const soundBtn = document.getElementById('soundBtn');

  let isPlaying = false;
  let fadeInterval = null;

  function fadeInMusic(targetVolume = 0.4){
    clearInterval(fadeInterval);
    music.volume = 0;

    const playPromise = music.play();
    if(playPromise !== undefined){
      playPromise.catch(() => {});
    }

    let vol = 0;
    fadeInterval = setInterval(() => {
      if(vol < targetVolume){
        vol += 0.02;
        music.volume = Math.min(vol, targetVolume);
      } else {
        clearInterval(fadeInterval);
      }
    }, 100);
  }

  function fadeOutMusic(){
    clearInterval(fadeInterval);

    let vol = music.volume;
    fadeInterval = setInterval(() => {
      if(vol > 0.02){
        vol -= 0.02;
        music.volume = Math.max(vol, 0);
      } else {
        clearInterval(fadeInterval);
        music.pause();
        music.currentTime = 0;
      }
    }, 100);
  }

  soundBtn.addEventListener('click', async () => {
    try{
      if(!isPlaying){
        fadeInMusic(0.4);
        soundBtn.classList.add('active');
        soundBtn.textContent = '🔊 Musik';
        isPlaying = true;
      } else {
        fadeOutMusic();
        soundBtn.classList.remove('active');
        soundBtn.textContent = '🔇 Musik';
        isPlaying = false;
      }
    }catch{
      soundBtn.textContent = '⚠️ Audio Fehler';
    }
  });
</script>
